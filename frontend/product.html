<!DOCTYPE html>
<html lang="en">

  <link rel="stylesheet" href="style.css">

<body class="bg-amber-50">

  </p>

  <header class="bg-amber-100 px-4 py-4 md:px-8">
  <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">

    <a href="index.html" class="shrink-0">
      <img src="images/smith.logo.avif" alt="THE KENYAN LOCKSMITH" class="h-14 md:h-24">
    </a>

    <nav id="main-nav" class="hidden w-full md:block md:w-auto order-last md:order-none">

        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="ourproducts.html">Our Products</a></li>
        <li><a href="contact.html">Contact us</a></li>
      </ul>
    </nav>

    <div class="flex items-center gap-3">
      <a href="login.html"><i class="fa-regular fa-user"></i></a>
      <a href="#" id="cart-btn">
        <i class="fa-solid fa-cart-plus"></i>
        <span id="cart-count">0</span>
      </a>
      <button type="button" id="light-btn" class="hidden sm:inline border px-2 py-1 text-xs rounded-lg bg-white">Light</button>
      <button type="button" id="dark-btn" class="hidden sm:inline border px-2 py-1 text-xs rounded-lg bg-black text-white">Dark</button>

    <input id="header-search" type="text" placeholder="Search"
      class="w-full md:w-40 border border-gray-300 px-2 py-1 text-sm order-last md:order-none">
  </div>
</header>

</div>

<br>
<br>
  <main class="max-w-5xl mx-auto px-4 py-10">

    </p>
    <div id="product-detail"></div>
  </main>

  <div id="cart-drawer" class="cart-drawer">

      <button type="button" id="cart-close" class="border px-2 py-1 text-xs ml-2">Close</button>
