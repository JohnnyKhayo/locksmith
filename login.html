<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - THE KENYAN LOCKSMITH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-amber-50">
  <main class="max-w-md mx-auto px-4 py-16">
    <p id="welcome-line" class="text-center mb-6"></p>

    <div class="border border-gray-300 bg-white p-8">
      <div id="register-view">
        <h1 class="text-xl text-center mb-2">Create account</h1>
        <p class="text-sm text-center text-gray-600 mb-6">
          Write down your email and password and keep them safe.
        </p>
        <form id="register-form" class="space-y-4">
          <div>
            <label class="text-sm">Name</label>
            <input id="reg-name" type="text" class="w-full border px-3 py-2">
          </div>
          <div>
            <label class="text-sm">Email</label>
            <input id="reg-email" type="email" class="w-full border px-3 py-2">
          </div>
          <div>
            <label class="text-sm">Password</label>
            <input id="reg-password" type="password" class="w-full border px-3 py-2">
          </div>
          <div>
            <label class="text-sm">Confirm password</label>
            <input id="reg-confirm" type="password" class="w-full border px-3 py-2">
          </div>
          <p id="reg-msg" class="text-sm"></p>
          <button type="submit" class="w-full bg-black text-white py-2">Register</button>
        </form>
        <p class="text-sm text-center mt-4">
          Already have an account?
          <button type="button" id="show-login" class="underline">Sign in</button>
        </p>
      </div>

      <div id="login-view" style="display: none;">
        <h1 class="text-xl text-center mb-6">Sign in</h1>
        <form id="login-form" class="space-y-4">
          <div>
            <label class="text-sm">Email</label>
            <input id="login-email" type="email" class="w-full border px-3 py-2">
          </div>
          <div>
            <label class="text-sm">Password</label>
            <input id="login-password" type="password" class="w-full border px-3 py-2">
          </div>
          <p id="login-msg" class="text-sm"></p>
          <button type="submit" class="w-full bg-black text-white py-2">Sign in</button>
        </form>
        <p class="text-sm text-center mt-4">
          New here?
          <button type="button" id="show-register" class="underline">Create account</button>
        </p>
      </div>
    </div>

    <p class="text-center mt-6">
      <a href="index.html" class="underline text-sm">Back to shop</a>
    </p>
  </main>
  <script src="main.js"></script>
</body>
</html>
